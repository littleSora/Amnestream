<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch - Amnestream</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://graphql.anilist.co" crossorigin>
<link rel="preconnect" href="https://s4.anilist.co">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/atlas.css">
<script defer src="js/api.js"></script>
<script src="js/config.js"></script>
<script defer src="js/common.js"></script>
<script defer src="js/mal.js"></script>
<script defer src="js/comments.js"></script>
<script defer src="js/sources.js"></script>
<script defer src="js/vplayer.js"></script>
<script defer src="js/watch.js"></script>
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/extras.css">
<link rel="stylesheet" href="css/vplayer.css">
<link rel="stylesheet" href="css/watch.css">
<link rel="stylesheet" href="css/dock.css">
<link rel="stylesheet" href="css/deck.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<script>/* Paint the last-known nav and theme before the first frame so the sidebar never blinks between pages */
(function(){try{var d=document.documentElement,s=JSON.parse(localStorage.getItem('as_settings')||'{}'),t=s.theme;
if(t&&t!=='sakura'&&t!=='photo'&&/^[a-z0-9-]+$/.test(t))d.dataset.theme=t;
d.dataset.ui=s.uiMode==='classic'?'classic':'modern';d.dataset.cards=(s.cardSize==='small'||s.cardSize==='large')?s.cardSize:'normal';
if(s.reduceMotion)d.classList.add('reduce-motion');
var h=document.getElementById('site-header'),c=localStorage.getItem('as_hdr_v3');
if(h&&c){h.innerHTML=c;var p=location.pathname.split('/').pop()||'index.html';
[].forEach.call(h.querySelectorAll('.main-nav a'),function(a){a.classList.toggle('on',a.getAttribute('href')===p)})}}catch(e){}})();</script>
<script src="js/dock.js"></script>

<main class="container wp-page">
  <div class="wp" id="wp">

    <!-- The picture. When you scroll past it, the stage turns into a small floating window you can drag to any corner. -->
    <div class="wp-slot" id="stage-slot">
      <div class="wp-ghost">
        <div>
          <p>Playing in the floating window</p>
          <button class="wp-pill" id="bring-back" type="button">Bring it back</button>
        </div>
      </div>
      <div class="wp-stage" id="stage" data-corner="br">
        <div class="wp-host" id="player"></div>
        <div class="wp-mini" id="mini-bar">
          <button type="button" class="wp-mini-play" id="mini-play" aria-label="Play or pause">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.4-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z"/></svg>
          </button>
          <span class="wp-mini-grip" aria-hidden="true"></span>
          <button type="button" id="mini-expand" aria-label="Back to the big player">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          </button>
          <button type="button" id="mini-close" aria-label="Close the floating window">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="wp-resume" id="resume" hidden>
          <div>
            <p>Player stopped</p>
            <button class="wp-pill" id="resume-btn" type="button">Resume</button>
          </div>
        </div>
      </div>
    </div>

    <header class="wp-head">
      <h1 id="w-title">Loading...</h1>
      <p class="wp-sub" id="w-sub"></p>
      <div class="wp-chips" id="w-chips"></div>
    </header>

    <!-- Control deck -->
    <section class="wp-deck" aria-label="Player controls">
      <div class="wp-grid">
        <div class="wp-audio" id="lang-seg" data-v="sub" role="group" aria-label="Audio">
          <span class="wp-audio-ink" aria-hidden="true"></span>
          <button type="button" data-lang="sub" class="on">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10.4 10.3a2.3 2.3 0 1 0 0 3.4M16.4 10.3a2.3 2.3 0 1 0 0 3.4"/></svg>Sub
          </button>
          <button type="button" data-lang="dub">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Dub
          </button>
        </div>
        <button class="wp-server" id="server-btn" type="button" aria-expanded="false" aria-controls="server-list">
          <i class="dot" id="server-dot"></i>
          <span><em>Server</em><b id="server-name">-</b></span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="wp-icon" id="reload-player" type="button" title="Reload the player" aria-label="Reload the player">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
        </button>
      </div>
      <div class="wp-servers" id="server-list" hidden></div>

      <div class="wp-steps">
        <button class="wp-step prev" id="prev-ep" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          <span><em>Previous</em><b id="prev-label">-</b></span>
        </button>
        <button class="wp-step next" id="next-ep" type="button">
          <span><em>Next</em><b id="next-label">-</b></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="wp-foot">
        <label class="wp-switch"><input type="checkbox" id="autonext" checked><i aria-hidden="true"></i><span>Auto-next</span></label>
        <a class="wp-link" id="info-link" href="#">Details
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <!-- Episodes / Seasons switch -->
    <aside class="wp-side"><div class="wp-side-in">
      <div class="dp-tabs wp-eps-switch" role="tablist" aria-label="Episodes or seasons">
        <span class="dp-ink" aria-hidden="true"></span>
        <button class="dp-tab on" role="tab" type="button" data-p="ep">Episodes</button>
        <button class="dp-tab" role="tab" type="button" data-p="rel" disabled>Seasons</button>
      </div>
      <div class="dp-panels" id="dp-panels">
        <div class="dp-panel on" id="p-ep" role="tabpanel">
          <div class="wp-eptools">
            <span id="ep-count"></span>
            <div>
              <button class="wp-tool" id="ep-view" type="button" title="Change the episode layout" aria-label="Change the episode layout"></button>
              <button class="wp-tool" id="ep-sort" type="button" title="Reverse the order" aria-label="Reverse the order"></button>
            </div>
          </div>
          <div class="side-eps" id="side-eps"></div>
        </div>
        <div class="dp-panel" id="p-rel" role="tabpanel"></div>
      </div>
      <!-- Shown while more episodes sit below the fade: the animated line from the home page, with an arrow -->
      <button class="wp-cue" id="ep-cue" type="button" aria-label="Show more episodes" tabindex="-1">
        <i aria-hidden="true"></i>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      </div>
    </aside>

    <section class="dp-comments watch-comments wp-comments" id="comments">
      <h2 id="cm-title">Episode comments <span class="cm-total" id="cm-total"></span></h2>
      <div id="p-cm"></div>
    </section>

    <!-- Recommendations: under the episode list on desktop, under the comments on mobile -->
    <section class="wp-recs" id="wp-recs" aria-label="Recommendations" hidden>
      <h2>Recommendations</h2>
      <div id="p-rec"></div>
    </section>
  </div>
</main>

<footer id="site-footer"></footer>

</body>
</html>
