<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch - Amnestream</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://graphql.anilist.co" crossorigin>
<link rel="preconnect" href="https://s4.anilist.co">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/atlas.css">
<script defer src="js/api.js"></script>
<script src="js/config.js"></script>
<script defer src="js/common.js"></script>
<script src="js/player.js"></script>
<script defer src="js/comments.js"></script>
<script defer src="js/watch.js"></script>
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/themes.css">
</head>
<body>
<header id="site-header"></header>
<script>(function(){var d=document.documentElement;if(!window.CSSViewTransitionRule)d.classList.add('pg-anim');try{var h=document.getElementById('site-header'),c=localStorage.getItem('as_hdr1');if(!h||!c)return;h.className='site-header';h.innerHTML=c;var p=location.pathname.split('/').pop()||'index.html',a=h.querySelectorAll('.main-nav a');for(var i=0;i<a.length;i++)if(a[i].getAttribute('href')===p)a[i].className='on'}catch(e){}})()</script>

<main class="container">
  <div class="watch-layout">
    <div>
      <div class="player-wrap" id="player"></div>

      <div class="watch-head">
        <h1 id="w-title">Loading...</h1>
        <p class="watch-sub" id="w-sub"></p>
      </div>

      <div class="player-bar">
        <div class="seg" id="lang-seg">
          <button data-lang="sub" class="on">Sub</button>
          <button data-lang="dub">Dub</button>
        </div>
        <select id="server">
          <option value="ani">Server: MegaPlay (AniList)</option>
          <option value="mal">Server: MegaPlay (MAL)</option>
        </select>
        <button class="btn" id="reload-player" type="button" title="Reload the player">Reload player</button>
        <div class="nav-eps">
          <button class="btn" id="prev-ep">&lsaquo; Prev</button>
          <button class="btn" id="next-ep">Next &rsaquo;</button>
        </div>
        <label class="btn btn-ghost"><input type="checkbox" id="autonext" checked> Auto-next</label>
        <a class="btn btn-ghost" id="info-link" href="#">Details</a>
      </div>

      <section class="dp-comments" id="comments">
        <h2 id="cm-title">Episode comments <span class="cm-total" id="cm-total"></span></h2>
        <div id="p-cm"></div>
      </section>
    </div>

    <aside class="side-col">
      <div class="side-panel">
        <h3>Episodes</h3>
        <div class="side-eps" id="side-eps"></div>
      </div>
      <section class="side-panel side-seasons" id="side-seasons" hidden></section>
    </aside>
  </div>
</main>

<footer id="site-footer"></footer>

</body>
</html>
